<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代码诗集 · Code Poet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:        #1a1008;
      --ink-mid:    #3d2b1f;
      --ink-light:  #7a6555;
      --ink-faint:  #b0a090;
      --paper:      #fdf6ec;
      --paper-warm: #f5ead6;
      --paper-dark: #ede0c8;
      --red-seal:   #c0392b;
      --gold:       #b8860b;
      --shadow:     rgba(26,16,8,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Serif SC', serif;
      background-color: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      /* subtle paper texture via CSS */
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(180,140,80,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(160,120,60,0.05) 0%, transparent 60%);
    }

    /* ── Header / ink-brush banner ────────────────────────────────────── */
    header {
      position: relative;
      text-align: center;
      padding: 4rem 2rem 3rem;
      overflow: hidden;
    }

    /* Ink-brush strokes via CSS (horizontal smear shapes) */
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        /* top left broad stroke */
        radial-gradient(ellipse 80% 18px at 15% 18%, rgba(26,16,8,0.18) 0%, transparent 100%),
        /* bottom right narrow stroke */
        radial-gradient(ellipse 55% 10px at 78% 82%, rgba(26,16,8,0.12) 0%, transparent 100%),
        /* diagonal accent */
        radial-gradient(ellipse 30% 6px at 55% 50%, rgba(26,16,8,0.08) 0%, transparent 100%);
      pointer-events: none;
    }

    .header-inner { position: relative; z-index: 1; }

    .site-title {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--ink);
      line-height: 1.1;
    }

    .site-title span {
      display: block;
      font-size: 0.42em;
      font-weight: 300;
      letter-spacing: 0.4em;
      color: var(--ink-light);
      margin-top: 0.4em;
    }

    /* Red seal (chop) */
    .seal {
      display: inline-block;
      width: 52px; height: 52px;
      border: 2.5px solid var(--red-seal);
      color: var(--red-seal);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1.3;
      text-align: center;
      padding: 6px 4px;
      margin-top: 1.6rem;
      transform: rotate(-6deg);
      opacity: 0.85;
    }

    /* ── Controls bar ─────────────────────────────────────────────────── */
    .controls {
      max-width: 860px;
      margin: 0 auto 2.5rem;
      padding: 0 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .counter {
      font-size: 0.82rem;
      color: var(--ink-light);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .counter strong {
      color: var(--ink-mid);
      font-size: 1rem;
    }

    .search-wrap {
      flex: 1;
      min-width: 180px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--paper-warm);
      border: 1px solid var(--paper-dark);
      border-radius: 2px;
      padding: 0.55rem 1rem;
      font-family: 'Noto Serif SC', serif;
      font-size: 0.88rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input::placeholder { color: var(--ink-faint); }
    .search-wrap input:focus { border-color: var(--ink-light); }

    .type-filter {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .chip {
      font-family: 'Noto Serif SC', serif;
      font-size: 0.75rem;
      padding: 0.28rem 0.7rem;
      border: 1px solid var(--ink-faint);
      border-radius: 1px;
      background: transparent;
      color: var(--ink-light);
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.18s;
    }
    .chip:hover, .chip.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    /* ── Poem cards ───────────────────────────────────────────────────── */
    .collection {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 2.8rem;
    }

    .poem-card {
      background: #fff;
      border: 1px solid var(--paper-dark);
      padding: 2.4rem 2.8rem 2rem;
      position: relative;
      box-shadow: 4px 6px 24px var(--shadow);
      animation: pageIn 0.55s ease both;
      transition: box-shadow 0.25s, transform 0.25s;
    }

    .poem-card:hover {
      box-shadow: 6px 10px 32px rgba(26,16,8,0.18);
      transform: translateY(-2px);
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(18px) rotate(-0.3deg); }
      to   { opacity: 1; transform: translateY(0)   rotate(0deg); }
    }

    /* Staggered animation delay */
    .poem-card:nth-child(1) { animation-delay: 0.05s; }
    .poem-card:nth-child(2) { animation-delay: 0.12s; }
    .poem-card:nth-child(3) { animation-delay: 0.19s; }
    .poem-card:nth-child(4) { animation-delay: 0.26s; }
    .poem-card:nth-child(5) { animation-delay: 0.33s; }

    /* Top rule — vertical ink line accent */
    .poem-card::before {
      content: '';
      position: absolute;
      left: 0; top: 2rem; bottom: 2rem;
      width: 3px;
      background: linear-gradient(to bottom, transparent, var(--ink-faint) 20%, var(--ink-faint) 80%, transparent);
    }

    .type-badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--red-seal);
      border: 1px solid var(--red-seal);
      padding: 0.18rem 0.55rem;
      margin-bottom: 0.9rem;
    }

    .poem-title {
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--ink);
      margin-bottom: 1.4rem;
      line-height: 1.2;
    }

    .poem-body {
      font-size: 1.05rem;
      line-height: 2.1;
      color: var(--ink-mid);
      letter-spacing: 0.08em;
      white-space: pre-line;
      margin-bottom: 1.5rem;
      padding-left: 0.2rem;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--paper-dark);
      margin: 1.2rem 0;
    }

    .insight {
      font-size: 0.9rem;
      font-style: italic;
      color: var(--ink-light);
      letter-spacing: 0.06em;
      line-height: 1.7;
    }

    .insight::before { content: '✦ '; }

    .commit-meta {
      margin-top: 1.2rem;
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      align-items: baseline;
    }

    .commit-meta span {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.68rem;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    .commit-meta .sha {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: var(--paper-warm);
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
      font-size: 0.65rem;
      color: var(--ink-light);
    }

    .stat-pill {
      display: inline-flex;
      gap: 0.5rem;
    }
    .stat-pill .ins { color: #27ae60; }
    .stat-pill .del { color: #e74c3c; }

    /* ── Empty state ──────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--ink-faint);
    }
    .empty p { font-size: 1rem; margin-top: 0.5rem; }

    /* ── Footer ───────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      font-size: 0.75rem;
      color: var(--ink-faint);
      letter-spacing: 0.08em;
      border-top: 1px solid var(--paper-dark);
    }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .poem-card { padding: 1.6rem 1.4rem 1.4rem; }
      .controls  { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1 class="site-title">
      代码诗集
      <span>CODE POET · VERSES FROM THE DIFF</span>
    </h1>
    <div class="seal">代码<br>詩魂</div>
  </div>
</header>

<div class="controls">
  <div class="counter" id="counter">已收录 <strong>—</strong> 首 commit 诗</div>
  <div class="search-wrap">
    <input type="search" id="search" placeholder="搜索诗名、关键词、作者……" />
  </div>
  <div class="type-filter" id="typeFilter">
    <button class="chip active" data-type="all">全部</button>
    <button class="chip" data-type="七言绝句">七言绝句</button>
    <button class="chip" data-type="现代诗">现代诗</button>
    <button class="chip" data-type="打油诗">打油诗</button>
    <button class="chip" data-type="俳句">俳句</button>
    <button class="chip" data-type="自由诗">自由诗</button>
  </div>
</div>

<main class="collection" id="collection" role="list" aria-label="诗集列表"></main>

<footer>
  每一次 git push，皆留一首诗 · Every commit, a verse · Powered by Claude &amp; GitHub Actions
</footer>

<script>
// ── Embedded fallback poems (3 samples) ───────────────────────────────────
const FALLBACK = [];

// ── State ─────────────────────────────────────────────────────────────────
let allPoems = [];
let activeType = 'all';
let searchQuery = '';

// ── Render ────────────────────────────────────────────────────────────────
function formatDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  } catch { return iso; }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(p, index) {
  const delay = Math.min(index * 0.07, 0.6);
  return `
  <article class="poem-card" role="listitem" style="animation-delay:${delay}s">
    <div class="type-badge">${escapeHtml(p.type)}</div>
    <h2 class="poem-title">《${escapeHtml(p.title)}》</h2>
    <div class="poem-body">${escapeHtml(p.poem)}</div>
    <hr class="divider" />
    <div class="insight">${escapeHtml(p.insight)}</div>
    <div class="commit-meta">
      <span class="sha">${p.commit_sha ? p.commit_sha.slice(0,7) : p.id}</span>
      <span>${escapeHtml(p.author)} · ${formatDate(p.timestamp)}</span>
      <span class="stat-pill">
        <span class="ins">+${p.insertions}</span>
        <span class="del">-${p.deletions}</span>
        <span>${p.files_changed} 文件</span>
      </span>
    </div>
    <div class="commit-meta" style="margin-top:0.4rem">
      <span style="font-style:italic;color:var(--ink-faint)">${escapeHtml(p.commit_message)}</span>
    </div>
  </article>`;
}

function applyFilters() {
  const q = searchQuery.toLowerCase();
  return allPoems.filter(p => {
    const typeMatch  = activeType === 'all' || p.type === activeType;
    const queryMatch = !q || [p.title, p.poem, p.author, p.commit_message, p.insight]
      .some(f => f && f.toLowerCase().includes(q));
    return typeMatch && queryMatch;
  });
}

function render() {
  const filtered = applyFilters();
  const coll = document.getElementById('collection');
  const counter = document.getElementById('counter');

  counter.innerHTML = `已收录 <strong>${allPoems.length}</strong> 首 commit 诗`;

  if (filtered.length === 0) {
    coll.innerHTML = `<div class="empty"><h3>此间无诗</h3><p>换个关键词或诗体类型试试</p></div>`;
    return;
  }
  coll.innerHTML = filtered.map((p, i) => renderCard(p, i)).join('');
}

// ── Event listeners ───────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

document.getElementById('typeFilter').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeType = chip.dataset.type;
  render();
});

// ── Load poems ────────────────────────────────────────────────────────────
async function loadPoems() {
  try {
    const res = await fetch('poems/collection.json?v=' + Date.now());
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    allPoems = Array.isArray(data) ? data : [];
  } catch {
    allPoems = FALLBACK;
  }
  render();
}

loadPoems();
</script>
</body>
</html>
